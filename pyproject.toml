[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ensai-agentic-student"
version = "0.1.0"
description = "ENSAI project: agentic AI for predictive maintenance"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "torch>=2.6,<3",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]